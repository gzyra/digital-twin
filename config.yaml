# ── Dashboard KPIs (center hero strip) ────────────────────────────────────
# Big-number cards shown across the top of the chat area. Each KPI pulls from a
# skill's cached memory result. Supported value sources per entry:
#   value: "..."        static text (placeholder)
#   skill + column      sum a numeric column from that skill's first table output
#   skill + count_rows  count rows in that skill's first table output
#   skill + field       read a single named field from that skill's outputs
# Optional formatting: prefix, suffix.
dashboard_kpis:
  - label: "Top-10 ATR"
    skill: cxaia_top_10_dids
    column: "ATR"
    prefix: "$"
  - label: "Deals Tracked"
    skill: cxaia_top_10_dids
    count_rows: true
  - label: "ATR to Renew"
    value: "—"

# ── LLM ──────────────────────────────────────────────────────────────────────
# llm_provider: litellm | circuit
llm_provider: "circuit"

# Used when llm_provider == litellm
model: "gpt-5-nano"

# Used when llm_provider == circuit (Cisco BridgeIT)
circuit:
  endpoint: "https://chat-ai.cisco.com"
  api_version: "2024-12-01-preview"
  model: "gpt-5-nano"
  # Prefer setting these via env vars (loaded by initapp.py from ~/.env/greg_ai_env.json):
  # BRIDGEIT_CLIENT_ID, BRIDGEIT_CLIENT_SEC, BRIDGEIT_KEY, BRIDGEIT_USERID
  client_id: ""
  client_secret: ""
  app_key: ""
  user_id: "digital-twin"
