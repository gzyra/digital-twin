# Local runtime configuration for digital-twin.
# Replace placeholders with your values.

start_url: "https://cxassistant.cisco.com/"
auth_state: "state.json"
headless: false
debug: true
skills_dir: "skills"
action_timeout_ms: 60000
load_timeout_ms: 60000

# Common URLs for quick reference during skill recording
common_urls:
  SalesForce: "https://ciscosales.lightning.force.com/lightning"
  "CX AIA": "https://cxassistant.cisco.com/"
  Google: "https://www.google.com"

record_urls: []

# Skills to run automatically at startup (headless, using recorded default values).
# Their outputs are displayed in the dashboard panel.
startup_skills:
  - cxaia_top_10_dids

# Directory for persisted skill results (memory).
memory_dir: "memory"

# How many hours a cached startup skill result stays valid before re-running.
startup_skill_ttl_hours: 24

# llm_provider: litellm | circuit
llm_provider: "circuit"

# Used by litellm mode
model: "gpt-5-nano"

# Used by circuit mode
circuit:
  endpoint: "https://chat-ai.cisco.com"
  api_version: "2024-12-01-preview"
  model: "gpt-5-nano"
  # Prefer setting these via env vars:
  # BRIDGEIT_CLIENT_ID, BRIDGEIT_CLIENT_SEC, BRIDGEIT_KEY, BRIDGEIT_USERID
  client_id: ""
  client_secret: ""
  app_key: ""
  user_id: "digital-twin"
